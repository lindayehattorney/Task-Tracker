<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>任務管理系統</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#8B6914;
  --navy:#0D1B2A;--navy-l:#1A2D42;
  --surf:#1E2D3D;--surf-h:#253545;
  --bd:rgba(201,168,76,0.2);--bd-b:rgba(201,168,76,0.45);
  --t1:#F0E6CC;--t2:#A89870;--tm:#6B7A8D;
  --r:8px;--rl:12px;
}
body{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;background:var(--navy);color:var(--t1);height:100vh;overflow:hidden;font-size:14px;}

/* Login */
#loginScreen{position:fixed;inset:0;background:var(--navy);z-index:300;display:flex;align-items:center;justify-content:center;}
.lcard{background:var(--navy-l);border:1px solid var(--bd-b);border-radius:16px;padding:48px;width:360px;display:flex;flex-direction:column;gap:20px;align-items:center;}
.licon{width:68px;height:68px;background:rgba(201,168,76,0.12);border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;}
.ltitle{font-size:19px;font-weight:700;color:var(--gold);letter-spacing:1px;}
.fg{display:flex;flex-direction:column;gap:5px;width:100%;}
.flabel{font-size:12px;color:var(--t2);font-weight:500;}
.finput,.fselect{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:8px 12px;font-size:13px;color:var(--t1);font-family:inherit;outline:none;width:100%;}
.finput:focus,.fselect:focus{border-color:var(--gold);}
.fselect option{background:var(--navy-l);}

/* App */
#app{flex-direction:column;height:100vh;} #app[style*="flex"]{display:flex !important;}
.header{background:linear-gradient(135deg,#0D1B2A,#1A2D42);border-bottom:1px solid var(--bd-b);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:68px;flex-shrink:0;position:relative;}
.logo{display:flex;align-items:center;gap:14px;}
.logo-img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1.5px solid var(--bd-b);background:#fff;}
.logo-texts{}
.logo-sub{font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-weight:500;}
.logo-name{font-size:16px;font-weight:700;color:var(--t1);letter-spacing:.5px;line-height:1.2;}
.logo-en{font-size:11px;color:var(--t2);letter-spacing:.5px;margin-top:1px;}
.header-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;}
.header-title{font-size:18px;font-weight:700;color:var(--t1);letter-spacing:2px;}
.header-title-en{font-size:11px;color:var(--t2);letter-spacing:2px;margin-top:2px;}
.layout{display:flex;flex:1;overflow:hidden;}

/* Sidebar */
/* Top nav bar */
.topnav{background:var(--navy-l);border-bottom:1px solid var(--bd);padding:0 16px;display:flex;align-items:center;gap:6px;height:48px;flex-shrink:0;overflow-x:auto;}
.topnav::-webkit-scrollbar{height:0;}
.tn-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r);cursor:pointer;font-size:13px;white-space:nowrap;transition:all .15s;border:none;font-family:inherit;background:transparent;color:var(--t2);}
.tn-btn:hover{background:rgba(201,168,76,0.08);color:var(--t1);}
.tn-btn.active{background:rgba(201,168,76,0.14);color:var(--gold);}
.tn-add{background:var(--gold);color:var(--navy);font-weight:700;}
.tn-add:hover{background:var(--gold-l);}
.tn-divider{width:1px;height:24px;background:var(--bd);flex-shrink:0;margin:0 4px;}
.tn-break{display:none;}
.tn-member{position:relative;border:1px solid transparent;}
.tn-member:hover{border-color:var(--bd-b);}
.tn-member.active{background:rgba(201,168,76,0.14);color:var(--gold);border-color:var(--bd-b);}
.tn-member.dragging{opacity:0.4;}
.tn-member.drag-over{border-left:2px solid var(--gold);}
.m-avatar{width:22px;height:22px;border-radius:50%;background:var(--gold-d);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gold-l);flex-shrink:0;}
.m-count{font-size:10px;color:var(--tm);background:var(--surf);padding:1px 6px;border-radius:8px;}
.m-edit{opacity:0.5;font-size:12px;color:var(--tm);cursor:pointer;background:none;border:none;padding:1px 3px;line-height:1;}
.tn-member:hover .m-edit{opacity:1;color:var(--gold);}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{padding:12px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:var(--navy-l);flex-shrink:0;}
.page-title{font-size:17px;font-weight:700;color:var(--gold);}
.search-box{display:flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:5px 11px;width:200px;}
.search-box input{background:none;border:none;outline:none;color:var(--t1);font-size:13px;width:100%;}

/* Stats */
.stats-row{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;position:sticky;top:0;z-index:15;background:#1A2535;}
/* 零用金：第二排 stats-row 收合、餘額橫幅不要 sticky 疊字 */
body.petty-mode #statsRow{display:none !important;}
body.petty-mode #typeStatsRow{position:static;}
.stat-box{flex:1;padding:10px 18px;border-right:1px solid var(--bd);}
.stat-clickable{cursor:pointer;transition:background .15s;}
.stat-clickable:hover{background:rgba(201,168,76,0.06);}
.stat-active{background:rgba(201,168,76,0.05);}
.stat-box:last-child{border-right:none;}
.stat-num{font-size:20px;font-weight:700;color:var(--gold);}
.stat-lbl{font-size:10px;color:var(--tm);margin-top:1px;}
/* 營運經理備忘錄：上下兩排標籤格固定同高、內容置中 */
.memo-stat-box{flex:1;height:56px;padding:0 14px;border-right:1px solid var(--bd);display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
.memo-stat-box:last-child{border-right:none;}
.memo-stat-box.stat-clickable{cursor:pointer;transition:background .15s;}
.memo-stat-box.stat-clickable:hover{background:rgba(201,168,76,0.06);}
.memo-stat-box.stat-active{background:rgba(201,168,76,0.05);}
.memo-tag-lbl{font-size:14px;font-weight:700;}
/* 標籤格文字：電腦版顯示全名，手機版顯示短名（手機版 CSS 在 480 media 覆蓋）*/
.lbl-full{display:inline;}
.lbl-short{display:none;}

/* Table */
.table-wrap{flex:1;overflow:auto;position:relative;}
table{width:max-content;min-width:100%;border-collapse:collapse;}
body.petty-mode table{table-layout:fixed;width:100%;}
@media (min-width: 481px) {
  html:not(.is-ipad) thead th:nth-child(2){position:sticky;top:0;left:0;z-index:30;background:#1A2535;}
  html:not(.is-ipad) tbody td:nth-child(2){position:sticky;left:0;z-index:5;background:#111F30;box-shadow:3px 0 6px rgba(0,0,0,0.25);}
  @media (hover: hover) and (pointer: fine){ html:not(.is-ipad) tbody tr:hover td:nth-child(2){background:#162438;} }
  html:not(.is-ipad) tbody tr.row-selected td:nth-child(2){background:#1a2d3e;}
}
thead th{position:sticky;top:0;z-index:10;background:#1A2535;padding:9px 12px;text-align:left;font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.8px;font-weight:500;border-bottom:1px solid var(--bd);white-space:nowrap;user-select:none;}
tbody tr{border-bottom:1px solid rgba(201,168,76,0.07);}
@media (hover: hover) and (pointer: fine){ tbody tr:hover{background:rgba(201,168,76,0.04);} }
tbody td{padding:0;vertical-align:middle;font-size:13px;position:relative;}
.cw{padding:8px 12px;min-height:38px;display:flex;align-items:center;}
.ct{color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.cm{color:var(--tm);}
td.ed .cw{cursor:pointer;}
@media (hover: hover) and (pointer: fine){ td.ed:hover .cw{background:rgba(201,168,76,0.07);border-radius:4px;} }

/* Inline inputs */
.ii{width:100%;background:var(--surf-h);border:1.5px solid var(--gold);border-radius:4px;padding:6px 8px;font-size:13px;color:var(--t1);font-family:inherit;outline:none;display:block;}
.ita{width:100%;background:var(--surf-h);border:1.5px solid var(--gold);border-radius:4px;padding:6px 8px;font-size:13px;color:var(--t1);font-family:inherit;outline:none;display:block;resize:none;min-height:64px;line-height:1.5;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;}
.bu{background:rgba(226,75,74,0.15);color:#FF7B7A;border:1px solid rgba(226,75,74,0.3);}
.bp{background:rgba(239,159,39,0.15);color:#F5B84A;border:1px solid rgba(239,159,39,0.3);}
.bd2{background:rgba(29,158,117,0.15);color:#2ECFA0;border:1px solid rgba(29,158,117,0.3);}
.dl-u{color:#FF7B7A;}
.dl-s{color:#F5B84A;}
.dl-o{color:#2ECFA0;}

/* Person chip */
.pchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;background:rgba(55,138,221,0.1);border:1px solid rgba(55,138,221,0.22);border-radius:20px;font-size:11px;color:#7DC3F7;white-space:nowrap;}
.tagchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;white-space:nowrap;font-weight:600;}

/* Buttons */
.btn{padding:6px 13px;border-radius:var(--r);font-size:13px;cursor:pointer;border:none;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:all .15s;}
.bp2{background:var(--gold);color:var(--navy);font-weight:700;}
.bp2:hover{background:var(--gold-l);}
.bg{background:transparent;border:1px solid var(--bd-b);color:var(--t2);}
.bg:hover{background:rgba(201,168,76,0.08);color:var(--t1);}
.bda{background:rgba(226,75,74,0.12);border:1px solid rgba(226,75,74,0.3);color:#FF7B7A;}
.bda:hover{background:rgba(226,75,74,0.22);}
.bico{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
.del-btn{opacity:0.7;background:none;border:none;color:#FF7B7A;cursor:pointer;padding:4px;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
tbody tr:hover .del-btn{opacity:1;}
.del-btn:hover{opacity:1!important;transform:scale(1.15);}

/* Status popup */
.status-popup{position:fixed;background:var(--navy-l);border:1px solid var(--bd-b);border-radius:var(--rl);padding:6px;min-width:140px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.sp-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--t2);transition:all .15s;}
.sp-item:hover{background:rgba(201,168,76,0.08);color:var(--t1);}
.sp-item.selected{color:var(--gold);}

/* Custom Calendar */
.cal-popup{position:fixed;background:var(--navy-l);border:1px solid var(--bd-b);border-radius:var(--rl);padding:16px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,0.5);width:300px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-size:15px;font-weight:600;color:var(--gold);}
.cal-nav{background:none;border:none;color:var(--t2);cursor:pointer;padding:4px 8px;border-radius:var(--r);font-size:16px;transition:all .15s;}
.cal-nav:hover{background:rgba(201,168,76,0.1);color:var(--gold);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{text-align:center;font-size:10px;color:var(--tm);padding:4px 0;font-weight:500;}
.cal-day{text-align:center;padding:7px 4px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--t2);transition:all .15s;line-height:1;}
.cal-day:hover{background:rgba(201,168,76,0.12);color:var(--t1);}
.cal-day.today{color:var(--gold);font-weight:600;}
.cal-day.selected{background:var(--gold);color:var(--navy);font-weight:700;}
.cal-day.other-month{color:var(--tm);opacity:.4;}
.cal-day.empty{cursor:default;}
.cal-day.empty:hover{background:none;}
.cal-footer{margin-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:12px;}
.cal-clear{font-size:12px;color:var(--tm);cursor:pointer;background:none;border:none;font-family:inherit;}
.cal-clear:hover{color:#FF7B7A;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;z-index:400;}
.overlay.show{display:flex;}
.modal{background:var(--navy-l);border:1px solid var(--bd-b);border-radius:var(--rl);width:340px;max-width:92vw;}
.mhead{padding:18px 22px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.mtitle{font-size:15px;font-weight:700;color:var(--gold);}
.mclose{background:none;border:none;color:var(--tm);cursor:pointer;font-size:22px;line-height:1;}
.mbody{padding:18px 22px;display:flex;flex-direction:column;gap:12px;}
.mfoot{padding:12px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;}


::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--bd-b);border-radius:3px;}

/* ── Responsive Design ── */

/* Tablet (768px and below) */
@media (max-width: 768px) {
  .header { padding: 0 16px; height: 60px; }
  .header-center { display: none; }
  .logo-name { font-size: 14px; letter-spacing: 1px; }
  .logo-en { display: none; }
  .logo-img { width: 40px; height: 40px; }

  .topnav { padding: 0 10px; gap: 4px; height: 44px; overflow-x: auto; }
  .tn-btn { padding: 5px 10px; font-size: 12px; }
  .tn-add { padding: 5px 12px; }

  .toolbar { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
  .page-title { font-size: 15px; }
  .search-box { width: 160px; }

  .stats-row { overflow-x: auto; }
  .stat-box { min-width: 80px; padding: 8px 12px; }
  .stat-num { font-size: 18px; }

  /* Hide less important columns on tablet */
  table col.col-courtdiv,
  thead th:nth-child(7),
  tbody td:nth-child(7) { display: none; }
}

/* Mobile (480px and below) - 全新卡片設計 v4（徹底重寫）*/
@media (max-width: 480px) {
  /* 容器全寬、可捲動 */
  body { overflow: auto !important; height: auto !important; }
  #app {
    height: auto !important; min-height: 100vh;
    overflow: visible !important; width: 100% !important;
  }
  .layout {
    overflow: visible !important; height: auto !important;
    width: 100% !important; flex-direction: column !important;
  }
  .main {
    overflow: visible !important; height: auto !important;
    width: 100% !important; flex: 1 1 100% !important; max-width: 100% !important;
  }
  .table-wrap { overflow: hidden !important; height: auto !important; width: 100% !important; }
  table, tbody { width: 100% !important; max-width: 100% !important; }
  .header, .topnav, .toolbar, .stats-row { width: 100% !important; box-sizing: border-box; }

  /* ── 最上方 Header：避開手機系統列（瀏海/動態島）── */
  .header {
    height: auto;
    min-height: 56px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-bottom: 10px;
    padding-left: 14px;
    padding-right: 14px;
  }
  .logo-img { width: 38px; height: 38px; }
  .logo-name { font-size: 15px; letter-spacing: 0.5px; }
  .logo-sub { font-size: 9px; }
  .header-center { display: none !important; }

  /* ── 頂部功能列 ── */
  .topnav { height: auto; padding: 8px 14px; gap: 6px; flex-wrap: wrap; overflow-x: visible !important; }
  .tn-btn { font-size: 14px; padding: 6px 12px; }
  .tn-add { font-size: 14px; }
  .m-count { display: none; }
  /* 人員頁籤：全部展開換行，不橫向捲動（讓 #memberItems 的子項參與 topnav 換行）*/
  #memberItems { display: contents !important; }
  .tn-member { flex-shrink: 0; }
  /* 「＋新增案件、全部案件」佔第一行，人員從第二行開始（純換行，不寫死斷點）*/
  .tn-break { display: block !important; flex-basis: 100% !important; width: 100% !important; height: 0 !important; margin: 0 !important; }
  /* 換行後 memberDivider 會落在行首很突兀，手機隱藏它（保留「新增案件｜全部案件」那條）*/
  #memberDivider { display: none !important; }
  /* 手機不顯示「新增人員」加號 */
  #addMemberBtn { display: none !important; }
  /* 手機隱藏人員頁籤的「⋯」編輯鈕，省寬度讓一行排得下 3 人
     （注意：m-edit 是巢狀 button，被瀏覽器解析成 tn-member 的兄弟，直接掛在 memberItems 下）*/
  #memberItems .m-edit, .topnav .m-edit { display: none !important; }
  /* 手機版標籤格用短名（電腦版全名） */
  .lbl-full { display: none !important; }
  .lbl-short { display: inline !important; }

  /* ── 工具列 ── */
  .toolbar { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
  .page-title { font-size: 17px; }
  .search-box { width: 100%; }

  /* ── 統計列 ── */
  .stats-row { flex-wrap: nowrap; position: static !important; }
  .stat-box {
    flex: 1; min-width: 0; padding: 10px 6px;
    border-right: 1px solid var(--bd) !important; border-bottom: none !important;
    text-align: center;
  }
  .stat-num { font-size: 22px; }
  .stat-lbl { font-size: 11px; }

  /* ══ 卡片 ══ */
  /* 手機：徹底關閉點擊高亮與所有變色（任何狀態都透明）*/
  * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; }
  /* td 永遠透明，.cw 永遠透明，不管 hover/active/focus */
  tbody td,
  tbody td:hover,
  tbody td:active,
  tbody td:focus,
  tbody td .cw,
  tbody td .cw:hover,
  tbody td .cw:active,
  tbody td.ed:hover .cw,
  tbody td.ed:active .cw,
  tbody td.badge-cell:hover,
  tbody td.person-cell:hover,
  tbody td.date-cell:hover {
    background: transparent !important;
    background-color: transparent !important;
  }
  /* 整列任何狀態都保持卡片底色 */
  tbody tr:hover,
  tbody tr:active,
  tbody tr:focus,
  tbody tr.select-row:hover,
  tbody tr.select-row.row-selected:hover {
    background: var(--navy-l) !important;
  }

  table, thead, tbody, tr, td, th { display: block !important; }
  thead { display: none !important; }

  tbody tr {
    background: var(--navy-l);
    border: 1.5px solid rgba(201,168,76,0.2);
    border-radius: 11px;
    margin: 9px 11px;
    padding: 13px 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    box-sizing: border-box;
    width: auto !important;
    max-width: calc(100vw - 22px) !important;
    overflow: hidden;
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "name     name"
      "chouse   chouse"
      "court    court"
      "status   person"
      "casenum  stock"
      "phone    ext"
      "fax      fax"
      "deadline admdl"
      "desc     desc"
      "admnote  admnote";
    column-gap: 9px;
    row-gap: 10px;
    align-items: start;
  }

  tbody td {
    padding: 0 !important; border: none !important;
    width: auto !important; max-width: 100% !important; min-width: 0 !important;
    overflow: hidden;
  }
  tbody td .cw, tbody td .ct {
    max-width: 100% !important;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  tbody td .cw { padding: 0 !important; min-height: auto !important; display: block; }

  /* checkbox 只在多選模式顯示 */
  tbody td.checkbox-col { display: none !important; }
  body.select-mode-on tbody tr { position: relative; }
  body.select-mode-on tbody td.checkbox-col {
    display: block !important; position: absolute; top: 12px; right: 12px;
  }

  /* 欄位定位（td 實際位置）*/
  tbody td:nth-child(2)  { grid-area: name; }      /* 案件名稱 */
  tbody td:nth-child(3)  { grid-area: chouse; }    /* 法院檢察署 */
  tbody td:nth-child(4)  { grid-area: status; }    /* 狀態 */
  tbody td:nth-child(5)  { grid-area: person; }    /* 負責人 */
  tbody td:nth-child(6)  { grid-area: court; }     /* 開庭日 */
  tbody td:nth-child(7)  { grid-area: deadline; }  /* 工作截止日 */
  tbody td:nth-child(8)  { grid-area: desc; }      /* 律師辦案事項 */
  tbody td:nth-child(9)  { grid-area: admnote; }   /* 行政事項 */
  tbody td:nth-child(10) { grid-area: admdl; }     /* 行政截止日 */
  tbody td:nth-child(11) { grid-area: casenum; }   /* 案號 */
  tbody td:nth-child(12) { grid-area: stock; }     /* 股別 */
  tbody td:nth-child(13) { grid-area: phone; }     /* 電話 */
  tbody td:nth-child(14) { grid-area: ext; }       /* 分機 */
  tbody td:nth-child(15) { grid-area: fax; }       /* 傳真 */
  tbody td:nth-child(16) { display: none !important; }  /* 刪除鈕 */

  /* 第1排 案件名稱：置中大字，無標籤 */
  tbody td:nth-child(2) { text-align: center; }
  tbody td:nth-child(2) .cw { text-align: center; }
  tbody td:nth-child(2) .ct {
    font-size: 18px !important; font-weight: 700;
    color: var(--t1); white-space: normal; line-height: 1.35;
    overflow-wrap: break-word; word-break: break-word;
  }

  /* 第2排 法院檢察署：置中，直接內文無標籤 */
  tbody td:nth-child(3) { text-align: center; }
  tbody td:nth-child(3) .cw { text-align: center; }
  tbody td:nth-child(3)::before { display: none !important; content: "" !important; }
  tbody td:nth-child(3) .ct {
    font-size: 17px !important; font-weight: 500;
    color: var(--t1); white-space: normal;
    overflow-wrap: break-word; word-break: break-word;
  }

  /* 其他欄位標籤 */
  tbody td:nth-child(4)::before  { content: "狀態"; }
  tbody td:nth-child(5)::before  { content: "負責人"; }
  tbody td:nth-child(6)::before  { content: "開庭日"; }
  tbody td:nth-child(7)::before  { content: "工作截止日"; }
  tbody td:nth-child(8)::before  { content: "律師辦案事項"; }
  tbody td:nth-child(9)::before  { content: "行政事項"; }
  tbody td:nth-child(10)::before { content: "行政截止日"; }
  tbody td:nth-child(11)::before { content: "案號"; }
  tbody td:nth-child(12)::before { content: "股別"; }
  tbody td:nth-child(13)::before { content: "電話號碼"; }
  tbody td:nth-child(14)::before { content: "分機"; }
  tbody td:nth-child(15)::before { content: "傳真號碼"; }
  tbody td:nth-child(4)::before,
  tbody td:nth-child(5)::before,
  tbody td:nth-child(6)::before,
  tbody td:nth-child(7)::before,
  tbody td:nth-child(8)::before,
  tbody td:nth-child(9)::before,
  tbody td:nth-child(10)::before,
  tbody td:nth-child(11)::before,
  tbody td:nth-child(12)::before,
  tbody td:nth-child(13)::before,
  tbody td:nth-child(14)::before,
  tbody td:nth-child(15)::before {
    display: block; font-size: 13px; color: var(--tm); margin-bottom: 3px;
  }

  /* 案號在窄欄自動換行 */
  tbody td:nth-child(11) .ct { white-space: normal !important; word-break: break-word; }

  /* 內容文字 */
  tbody td .ct, tbody td .cw span, tbody td a { font-size: 16px; }

  /* 負責人 chip 左右並排 */
  tbody td:nth-child(5) .cw > div {
    flex-direction: row !important; flex-wrap: wrap; gap: 5px !important;
  }

  /* 開庭日整排置中 */
  tbody td:nth-child(6) { text-align: center; }
  tbody td:nth-child(6) .cw { justify-content: center; }
  tbody td:nth-child(6)::before { text-align: center; }
  /* 工作截止日、行政截止日 */
  tbody td:nth-child(7) .cw, tbody td:nth-child(10) .cw { justify-content: flex-start; }

  /* 律師辦案事項：完整，上分隔線 */
  tbody td:nth-child(8) {
    margin-top: 3px; padding-top: 10px !important;
    border-top: 1px solid rgba(201,168,76,0.12);
  }
  tbody td:nth-child(8) .ct {
    white-space: pre-wrap; line-height: 1.6; font-size: 16px; color: var(--t2);
    overflow-wrap: break-word; word-break: break-word; max-width: 100% !important;
  }
  /* 行政事項：完整文字區 */
  tbody td:nth-child(9) .ct {
    white-space: pre-wrap; line-height: 1.6; font-size: 16px; color: var(--t2);
    overflow-wrap: break-word; word-break: break-word; max-width: 100% !important;
  }

  /* ═══ 營運經理備忘錄：手機卡片（照律師卡片樣式，只有 4 樣：標題→截止日→標籤→詳細說明）═══ */
  body.memo-mode tbody tr {
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "mname   mname"
      "mddl    mddl"
      "mtags   mtags"
      "mdesc   mdesc" !important;
  }
  /* 欄位定位：備忘錄表格 td 順序＝checkbox(1) 待辦(2) 標籤(3) 截止日(4) 詳細(5) 刪除(6) */
  body.memo-mode tbody td:nth-child(2) { grid-area: mname; text-align: center; }
  body.memo-mode tbody td:nth-child(3) { grid-area: mtags; }
  body.memo-mode tbody td:nth-child(4) { grid-area: mddl; text-align: center; }
  body.memo-mode tbody td:nth-child(5) { grid-area: mdesc; }
  body.memo-mode tbody td:nth-child(6) { display: none !important; } /* 紅色垃圾桶不顯示 */
  /* 待辦事項：置中大字、無標籤 */
  body.memo-mode tbody td:nth-child(2) .cw { text-align: center; }
  body.memo-mode tbody td:nth-child(2) .ct {
    font-size: 18px !important; font-weight: 700; color: var(--t1);
    white-space: normal; line-height: 1.35; overflow-wrap: break-word; word-break: break-word;
  }
  body.memo-mode tbody td:nth-child(2)::before { display: none !important; content: "" !important; }
  /* 截止日：置中，標籤「截止日」 */
  body.memo-mode tbody td:nth-child(4) .cw { justify-content: center; }
  body.memo-mode tbody td:nth-child(4)::before { content: "截止日"; display: block; font-size: 13px; color: var(--tm); margin-bottom: 3px; text-align: center; }
  /* 標籤：置左、chip 橫向排列，標籤「標籤」 */
  body.memo-mode tbody td:nth-child(3)::before { content: "標籤"; display: block; font-size: 13px; color: var(--tm); margin-bottom: 3px; }
  body.memo-mode tbody td:nth-child(3) .cw > div {
    flex-direction: row !important; flex-wrap: wrap; gap: 5px !important;
  }
  /* 詳細說明：完整文字、上分隔線，標籤「詳細說明」 */
  body.memo-mode tbody td:nth-child(5) {
    margin-top: 3px; padding-top: 10px !important;
    border-top: 1px solid rgba(201,168,76,0.12);
  }
  body.memo-mode tbody td:nth-child(5)::before { content: "詳細說明"; display: block; font-size: 13px; color: var(--tm); margin-bottom: 3px; }
  body.memo-mode tbody td:nth-child(5) .ct {
    white-space: pre-wrap; line-height: 1.6; font-size: 16px; color: var(--t2);
    overflow-wrap: break-word; word-break: break-word; max-width: 100% !important;
  }

  /* ═══ 零用金：手機卡片（金額大字置中、類別置中放大；下面日期+概述小字）═══
     欄位順序：checkbox(1) 日期(2) 類別(3) 金額(4) 概述(5) 刪除(6) */
  body.petty-mode tbody tr {
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "pamt   pamt"
      "pcat   pcat"
      "pdate  pnote" !important;
    align-items: center;
    row-gap: 12px !important;
  }
  body.petty-mode tbody td:nth-child(1) { display: none; }  /* checkbox 欄平常隱藏，不佔版面 */
  body.petty-mode tbody td:nth-child(4) { grid-area: pamt; }   /* 金額 */
  body.petty-mode tbody td:nth-child(3) { grid-area: pcat; }   /* 類別 */
  body.petty-mode tbody td:nth-child(2) { grid-area: pdate; }  /* 日期 */
  body.petty-mode tbody td:nth-child(5) { grid-area: pnote; }  /* 概述 */
  body.petty-mode tbody td:nth-child(6) { display: none !important; } /* 刪除鈕手機不顯示（改用多選）*/
  body.petty-mode tbody td::before { display: none !important; content: "" !important; }
  /* 金額：大字置中 */
  body.petty-mode tbody td:nth-child(4) { text-align: center !important; font-size: 30px !important; font-weight: 700 !important; }
  /* 類別：置中、放大 chip */
  body.petty-mode tbody td:nth-child(3) { text-align: center !important; }
  body.petty-mode tbody td:nth-child(3) > div { justify-content: center !important; }
  body.petty-mode tbody td:nth-child(3) .tagchip { font-size: 16px !important; padding: 5px 16px !important; font-weight: 700 !important; }
  body.petty-mode tbody td:nth-child(3) > span { font-size: 16px !important; font-weight: 700 !important; }
  /* 日期＋概述：小字，上有分隔線 */
  body.petty-mode tbody td:nth-child(2) { color: var(--tm) !important; font-size: 13px !important; padding-top: 10px !important; border-top: 1px solid rgba(201,168,76,0.12); text-align: left !important; justify-content: flex-start !important; }
  body.petty-mode tbody td:nth-child(2) .cw { justify-content: flex-start !important; }
  body.petty-mode tbody td:nth-child(5) { color: var(--t2) !important; font-size: 13px !important; text-align: right !important; padding-top: 10px !important; border-top: 1px solid rgba(201,168,76,0.12); }
  /* 多選模式：勾選框浮在卡片右上角（照案件卡片，不佔版面）*/
  body.petty-mode.select-mode-on tbody tr { position: relative; }
  body.petty-mode.select-mode-on tbody td:nth-child(1) {
    display: block !important; position: absolute; top: 12px; right: 12px;
    grid-area: unset !important; width: auto; padding: 0; border: none; z-index: 2;
  }

  /* Modal / Calendar / Popups */
  .modal { width: 95vw !important; max-height: 85vh; overflow-y: auto; }
  .mbody { padding: 14px 16px; gap: 10px; }
  .form-row { grid-template-columns: 1fr !important; }
  .cal-popup { width: calc(100vw - 24px) !important; left: 12px !important; right: 12px; }
  .status-popup, #personPopup {
    position: fixed !important;
    top: 50% !important; left: 50% !important;
    bottom: auto !important; right: auto !important;
    transform: translate(-50%, -50%) !important;
    width: 84vw !important; max-width: 360px;
    max-height: 70vh; overflow-y: auto;
    border-radius: 18px !important; padding: 18px !important;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px var(--bd-b);
    border: 1.5px solid var(--bd-b) !important;
    background: var(--navy-l) !important;
  }

  /* 登入頁 */
  #loginScreen { padding: 20px; }
  .lcard { width: 100%; padding: 32px 20px; }
  .ltitle { font-size: 18px; }
}


@media (max-width: 480px) {
  #loginScreen { padding: 20px; }
  .lcard { width: 100%; padding: 32px 24px; }
  .ltitle { font-size: 18px; }

/* ═══ iPad：營運經理備忘錄卡片（照搬律師卡片的 5 欄骨架，只換內容）═══

   營運：待辦 + 標籤(橫向一排)；截止日 + 詳細×4 */
html.is-ipad body.memo-mode tbody tr:has(td.checkbox-col) {
  grid-template-columns: 1fr 1fr 1fr 1fr 1fr !important;
  grid-template-areas:
    "mname  mtags  mtags  mtags  mtags"

  align-items: stretch !important;

/* 備忘錄欄位順序：checkbox(1) 待辦(2) 標籤(3) 截止日(4) 詳細(5) 刪除(6) */

html.is-ipad body.memo-mode tbody td:nth-child(3) { grid-area: mtags; align-self: center; overflow: visible; }
/* 截止日、詳細：同一排、強制上緣分隔線齊平（用 align-self:start 確保各自從該排頂端起算）*/
html.is-ipad body.memo-mode tbody td:nth-child(4) { grid-area: mddl; align-self: start; margin-top: 6px; padding-top: 14px; border-top: 1px solid rgba(201,168,76,0.12); }
html.is-ipad body.memo-mode tbody td:nth-child(5) { grid-area: mdesc; align-self: start; margin-top: 6px; padding-top: 14px; border-top: 1px solid rgba(201,168,76,0.12); }

/* 標籤：靠右、橫向一整排、不換行、無文字標籤；順序照 render 已固定（SEO→其他）*/

];

// ── 零用金 ──
let pettyCash = [];        // 零用金帳目
let pettyView = false;     // 是否在零用金頁面
let trashedPetty = [];     // 零用金垃圾桶
let pettyModalCats = [];   // 支出視窗暫存已選類別
const PETTY_CATS = [
  {key:'post',    label:'郵務', color:'#7BA6D3'},
  {key:'express', label:'快遞', color:'#E8955A'},
  {key:'supply',  label:'耗材', color:'#9B7FE8'},
  {key:'other',   label:'其他', color:'#F7C948'}
];
function pettyCatByKey(k){ return PETTY_CATS.find(t=>t.key===k) || null; }
// 對應零用金資料列（DB → JS）
function mapPettyRow(row){
  return {
    id: row.id,
    entryType: row.entry_type,        // 'income' 撥款 / 'expense' 支出
    amount: Number(row.amount)||0,
    categories: row.categories || [],
    note: row.note || '',
    entryDate: row.entry_date,        // yyyy-mm-dd
    created_at: row.created_at,
    deleted_at: row.deleted_at || null
  };
}
// 目前餘額 = 總撥款 - 總支出（只算未刪除的）
function pettyBalance(){
  return pettyCash.reduce(function(sum, e){
    return sum + (e.entryType==='income' ? e.amount : -e.amount);
  }, 0);
}
// 本月撥款 / 本月支出
function pettyMonthTotals(){
  var now = new Date();
  var ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var inc=0, exp=0;
  pettyCash.forEach(function(e){
    if((e.entryDate||'').slice(0,7)===ym){
      if(e.entryType==='income') inc+=e.amount; else exp+=e.amount;
    }
  });
  return {inc:inc, exp:exp};
}
// 金額格式化（加千分位）
function fmtMoney(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
// 渲染一筆支出的類別 chip（各自顏色，橫向）
function renderPettyCatChips(e){
  if(e.entryType==='income') return '<span style="font-size:12px;color:#5FC98E;font-weight:600">＋ 撥款</span>';
  var keys = e.categories || [];
  if(!keys.length) return '<span class="cm">—</span>';
  var ordered = PETTY_CATS.filter(t=>keys.includes(t.key));
  return '<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">'+ordered.map(function(t){
    return '<span class="tagchip" style="color:'+t.color+';background:'+hexToRgba(t.color,0.12)+';border:1px solid '+hexToRgba(t.color,0.30)+'">'+t.label+'</span>';
  }).join('')+'</div>';
}

// 判斷目前是否在「營運經理」頁面
function isOpsManagerView(){
  var m = currentMemberId ? members.find(x=>x.id===currentMemberId) : null;
  return !!(m && m.name==='營運經理');
}
// 由 key 取標籤物件 / 顏色 / 名稱
function memoTagByKey(k){ return MEMO_TAGS.find(t=>t.key===k) || null; }
// 依標籤顏色產生半透明底色（用於 chip 背景）
function hexToRgba(hex, a){
  var h = hex.replace('#','');
  var r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
// 渲染一筆待辦的標籤 chip（每個標籤自己的顏色，直排，照 MEMO_TAGS 固定順序）
function renderMemoTagChips(c){
  var keys = c.memoTags || [];
  if(!keys.length) return '<span class="cm">—</span>';
  // 照 MEMO_TAGS 順序排，避免順序亂跳
  var ordered = MEMO_TAGS.filter(t=>keys.includes(t.key));
  return '<div style="display:flex;flex-direction:column;gap:3px;align-items:flex-start">'+ordered.map(function(t){
    return '<span class="tagchip" style="color:'+t.color+';background:'+hexToRgba(t.color,0.12)+';border:1px solid '+hexToRgba(t.color,0.30)+'">'+t.label+'</span>';
  }).join('')+'</div>';
}

// ── Load all data from Supabase ──
function mapCaseRow(row){
  return {
    id: row.id,
    name: row.name || '',
    status: row.status || 'urgent',
    court: row.court || '',
    deadline: row.deadline || '',
    courthouse: row.courthouse || '',
    caseNum: row.casenum || '',
    courtStock: row.courtstock || '',
    phone: row.phone || '',
    ext: row.ext || '',
    desc: row.description || '',
    adminNote: row.admin_note || '',
    adminDeadline: row.admin_deadline || '',
    fax: row.fax || '',
    caseType: row.case_type || 'litigation',
    personIds: row.personids || [],
    isMemo: row.is_memo || false,
    memoTags: row.memo_tags || [],
    created_at: row.created_at,
    deleted_at: row.deleted_at || null
  };
}

function loadData(){
  return Promise.all([
    _SB.from('members').select('*').is('deleted_at', null).order('sort_order'),
    _SB.from('cases').select('*').is('deleted_at', null).order('created_at', {ascending: false}),
    _SB.from('petty_cash').select('*').is('deleted_at', null).order('entry_date', {ascending: false}).order('created_at', {ascending: false})
  ]).then(function(results){
    var mr = results[0], cr = results[1], pr = results[2];
    if(mr.error){ console.error('Load members error:', mr.error); return; }
    if(cr.error){ console.error('Load cases error:', cr.error); return; }
    if(pr && pr.error){ console.error('Load petty error:', pr.error); }
    members = mr.data || [];
    cases = (cr.data || []).map(mapCaseRow);
    pettyCash = (pr && pr.data ? pr.data : []).map(mapPettyRow);
    selectedCaseIds = [];
    renderSidebar();
    renderCases();
  });
}

function loadTrash(){
  return _SB.from('cases').select('*').not('deleted_at', 'is', null).order('deleted_at', {ascending: false}).then(function(r){
    if(r.error){ console.error('Load trash error:', r.error); return; }
    trashedCases = (r.data || []).map(mapCaseRow);
    renderTrash();
  });
}

// ── Save member to Supabase ──
function dbSaveMember(m, callback){
  var isNew = !m.id || m.id.startsWith('tmp_');
  if(isNew){
    _SB.from('members').insert({
      name: m.name,
      sort_order: m.sort_order || 0
    }).select().single().then(function(r){
      if(r.error){ console.error('Insert member error:', r.error); alert('儲存失敗：' + r.error.message); return; }
      m.id = r.data.id;
      if(callback) callback();
      loadData();
    });
  } else {
    _SB.from('members').update({
      name: m.name,
      sort_order: m.sort_order || 0
    }).eq('id', m.id).then(function(r){
      if(r.error){ console.error('Update member error:', r.error); alert('更新失敗：' + r.error.message); return; }
      if(callback) callback();
      loadData();
    });
  }
}

function calPrevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function calNextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function renderCalendar(){
  const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('calTitle').textContent=calYear+'年 '+months[calMonth];
  const grid=document.getElementById('calGrid');
  const dows=['一','二','三','四','五','六','日'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=(new Date(calYear,calMonth,1).getDay()+6)%7;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  let selected='';
  if(calTarget){
    if(calTarget.pettyRow){
      var pe=pettyCash.find(function(x){return x.id===calTarget.id;});
      selected=pe?pe.entryDate||'':'';
    } else if(calTarget.petty){
      selected=document.getElementById('pcDate')?document.getElementById('pcDate').value||'':'';
    } else if(calTarget.memo){
      selected=document.getElementById('moDeadline')?document.getElementById('moDeadline').value||'':'';
    } else if(calTarget.modal){
      const fieldId=calTarget.field==='court'?'cCourt':'cDeadline';
      selected=document.getElementById(fieldId)?document.getElementById(fieldId).value||'':'';
    } else {
      const c=cases.find(x=>x.id===calTarget.caseId);if(c)selected=c[calTarget.field]||'';
    }
  }
  // prev month padding
  for(let i=first-1;i>=0;i--){
    html+=`<div class="cal-day other-month">${daysInPrev-i}</div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(calYear,calMonth,d);
    const dtStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=dt.getTime()===today.getTime();
    const isSel=selected===dtStr;
    html+=`<div class="cal-day${isToday?' today':''}${isSel?' selected':''}" onclick="pickDate('${dtStr}')">${d}</div>`;
  }
  // fill remaining
  const total=first+daysInMonth;
  const rem=(7-total%7)%7;
  for(let d=1;d<=rem;d++) html+=`<div class="cal-day other-month">${d}</div>`;
  grid.innerHTML=html;
}
function pickDate(dtStr){
  if(!calTarget) return;
  if(calTarget.pettyRow){
    dbUpdatePettyField(calTarget.id, {entry_date: dtStr});
    closeCalendar(); return;
  }
  if(calTarget.petty){
    setPettyModalDate(dtStr);
    closeCalendar(); return;
  }
  if(calTarget.memo){
    document.getElementById('moDeadline').value=dtStr;
    var pm=dtStr.split('-');
    document.getElementById('moDeadlineLabel').textContent=pm[0]+'/'+pm[1]+'/'+pm[2];
    document.getElementById('moDeadlineLabel').style.color='var(--t1)';
    closeCalendar(); return;
  }
  if(calTarget.modal){
    const fieldId=calTarget.field==='court'?'cCourt':'cDeadline';
    const labelId=calTarget.field==='court'?'cCourtLabel':'cDeadlineLabel';
    document.getElementById(fieldId).value=dtStr;
    const p=dtStr.split('-');
    document.getElementById(labelId).textContent=p[0]+'/'+p[1]+'/'+p[2];
    document.getElementById(labelId).style.color='var(--t1)';
    closeCalendar(); return;
  }
  var caseObj=cases.find(function(x){return x.id===calTarget.caseId;});
  if(caseObj){
    caseObj[calTarget.field]=dtStr;
    renderCases();
    dbSaveCase(caseObj);
  }
  closeCalendar();
}

// ── Inline text editing ──
function commitActiveCell(){
  if(!activeCell) return;
  var caseId=activeCell.caseId, field=activeCell.field, input=activeCell.input, td=activeCell.td;
  var caseObj=cases.find(function(x){return x.id===caseId;});
  var changed=false;
  if(caseObj){
    // 法院欄自動偵測：打「非訟」或「法律顧問」（完全相符）自動轉類型
    if(field==='courthouse'){
      var v=(input.value||'').trim();
      if(v==='非訟'){
        caseObj.caseType='nonlitigation'; caseObj.courthouse='';
        activeCell=null; renderCases(); dbSaveCase(caseObj); return;
      }
      if(v==='法律顧問'){
        caseObj.caseType='counsel'; caseObj.courthouse='';
        activeCell=null; renderCases(); dbSaveCase(caseObj); return;
      }
    }
    if(caseObj[field]!==input.value){
      caseObj[field]=input.value;
      dbSaveCase(caseObj);
      changed=true;
    }
  }
  activeCell=null;
  // 一律重繪以清掉輸入框，避免多個格子同時可編輯
  renderCases();
}
function activateTextCell(td,caseId,field){
  if(activeCell&&activeCell.td===td) return;
  commitActiveCell();
  const caseObj=cases.find(x=>x.id===caseId);
  if(!caseObj) return;
  td.innerHTML='';
  let input;
  const textareaFields=['desc','name','courthouse','caseNum','courtStock'];
  // 進行概述以外的欄位：Enter 儲存跳出，Shift+Enter 換行
  const enterSavesFields=['name','courthouse','caseNum','courtStock','phone','ext','fax'];
  if(textareaFields.includes(field)){
    input=document.createElement('textarea');
    input.className='ita';
    input.style.minHeight='36px';
  } else {
    input=document.createElement('input');
    input.type='text';
    input.className='ii';
  }
  // 關閉瀏覽器自動填入建議（避免傳真/電話欄跳出 email 建議）
  // 號碼類欄位用 tel 型別，避免 Safari 誤判為 email
  if(input.tagName==='INPUT' && (field==='phone'||field==='fax'||field==='ext')){
    input.type='tel';
  }
  input.setAttribute('autocomplete','new-password');
  input.setAttribute('autocorrect','off');
  input.setAttribute('autocapitalize','off');
  input.setAttribute('spellcheck','false');
  input.setAttribute('name','no_autofill_'+Math.random().toString(36).slice(2,10));
  input.setAttribute('data-lpignore','true');
  input.setAttribute('data-form-type','other');
  input.value=caseObj[field]||'';
  var isComposing=false;
  input.addEventListener('compositionstart',function(){ isComposing=true; });
  input.addEventListener('compositionend',function(){ 
    // 用 setTimeout 確保 keydown 先處理完再把 isComposing 設回 false
    setTimeout(function(){ isComposing=false; }, 0);
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      commitActiveCell();renderCases();
    } else if(e.key==='Enter' && enterSavesFields.includes(field)){
      // e.isComposing 是瀏覽器原生屬性，isComposing 是我們自己的變數，兩個都檢查
      if(isComposing || e.isComposing){
        // 輸入法選字中，不做任何事
        return;
      } else if(e.shiftKey){
        // Shift+Enter：換行
        return;
      } else {
        // Enter：儲存並跳出
        e.preventDefault();
        commitActiveCell();renderCases();
      }
    }
  });
  input.addEventListener('blur',function(){
    setTimeout(function(){
      if(activeCell&&activeCell.input===input){
        commitActiveCell();
      }
    },250);
  });
  activeCell={td,caseId,field,input};
  td.appendChild(input);
  input.focus();
}

// ── Render ──
function badge(s){
  if(s==='urgent') return '<span class="badge bu">優先處理</span>';
  if(s==='progress') return '<span class="badge bp">處理中</span>';
  if(s==='done') return '<span class="badge bd2">已完成</span>';
  return '';
}
function fmtDate(d){
  if(!d) return '';
  const p=d.split('-');
  return p[0]+'/'+p[1]+'/'+p[2];
}
function dlCls(d){
  if(!d) return 'dl-o';
  const diff=(new Date(d)-new Date())/(86400000);
  return diff<0?'dl-u':diff<=7?'dl-s':'dl-o';
}
function isPast(d){
  if(!d) return false;
  return (new Date(d)-new Date()) < 0;
}
// 回傳日期相對今天的天數差（0=今天, 1=明天, -1=昨天...）
function dayDiff(d){
  if(!d) return null;
  var today=new Date(); today.setHours(0,0,0,0);
  var target=new Date(d); target.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
// 顯示用文字：今天/明天/日期
function fmtDateSmart(d){
  if(!d) return '';
  var diff=dayDiff(d);
  if(diff===0) return '今天';
  if(diff===1) return '明天';
  return fmtDate(d);
}
// 是否為今天（今天要紅色但不刪除線）
function isToday(d){
  return dayDiff(d)===0;
}
// 日期樣式：刪除線（過期）＋顏色
function dateStyle(d){
  if(!d) return '';
  var s='';
  if(isPast(d) && !isToday(d)){
    s+='text-decoration:line-through;text-decoration-color:currentColor;';
  }
  return s;
}
// 日期顏色class：今天用過期紅色(dl-u)但不刪除線
function dlClsSmart(d){
  if(!d) return 'dl-o';
  if(isToday(d)) return 'dl-u'; // 今天：紅色
  return dlCls(d);
}
function getMemberName(id){
  if(!id) return '';
  const m=members.find(x=>x.id===id);
  return m?m.name:'';
}

function renderCases(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();

  if(pettyView){
    renderPettyView(q);

  }
  // 判斷目前選的負責人
  var currentMember = currentMemberId ? members.find(x=>x.id===currentMemberId) : null;

  if(currentMember && currentMember.name==='營運經理'){
    renderMemoView(q, currentMember);
    return;
  }
  ensureCaseHead(); // 從備忘錄/零用金切回時還原案件表頭
  document.body.classList.remove('memo-mode');

  var isSecretary = currentMember && currentMember.name==='小秘書';
  let data;
  if(isSecretary){
    // 小秘書專屬：篩選「行政事項」或「行政截止日」任一有填的案件（排除備忘錄）
    data = cases.filter(c=>!c.isMemo && ((c.adminNote && c.adminNote.trim()!=='') || (c.adminDeadline && c.adminDeadline.trim()!=='')));
    // 照行政截止日排序（愈早愈前面，沒填的排最後）
    data.sort(function(a,b){
      var da = a.adminDeadline||'', db = b.adminDeadline||'';
      if(!da && !db) return 0;
      if(!da) return 1;
      if(!db) return -1;
      return da < db ? -1 : (da > db ? 1 : 0);
    });
  } else if(currentMemberId){
    data = cases.filter(c=>!c.isMemo && (c.personIds||[]).includes(currentMemberId));
  } else {
    data = cases.filter(c=>!c.isMemo);
  }
  if(q) data=data.filter(c=>{
    // 全域搜尋：涵蓋所有欄位，但排除負責人名字
    var fields=[
      c.name, c.courthouse, c.status,
      c.court, c.deadline, c.adminDeadline,
      c.desc, c.adminNote,
      c.caseNum, c.courtStock, c.phone, c.ext, c.fax
    ];
    // 狀態中文對照也可搜尋（優先處理/處理中/已完成）
    var statusText = c.status==='urgent'?'優先處理':(c.status==='progress'?'處理中':(c.status==='done'?'已完成':''));
    fields.push(statusText);
    return fields.some(function(v){
      return (v||'').toString().toLowerCase().includes(q);
    });
  });
  // ── 類型統計（在套用類型篩選前算，但要先套用狀態篩選以外的搜尋）──
  // 類型數字：不受類型篩選影響，但受狀態篩選影響（疊加邏輯）
  var dataForTypeCount = statusFilter ? data.filter(c=>c.status===statusFilter) : data;
  const typeAll = dataForTypeCount.length;
  const typeLit = dataForTypeCount.filter(c=>(c.caseType||'litigation')==='litigation').length;
  const typeNon = dataForTypeCount.filter(c=>c.caseType==='nonlitigation').length;
  const typeCounsel = dataForTypeCount.filter(c=>c.caseType==='counsel').length;
  // 套用類型篩選
  if(typeFilter) data=data.filter(c=>(c.caseType||'litigation')===typeFilter);
  // 狀態數字：受類型篩選影響（疊加邏輯）
  const totalCount=data.length;
  const urgent=data.filter(c=>c.status==='urgent').length;
  const prog=data.filter(c=>c.status==='progress').length;
  const done=data.filter(c=>c.status==='done').length;
  // 套用狀態篩選
  if(statusFilter) data=data.filter(c=>c.status===statusFilter);

  // ── 動態標題：一五一十，類型在前、狀態在後，「全部」也要寫出來 ──
  var typeLabel = typeFilter==='litigation'?'訴訟':(typeFilter==='nonlitigation'?'非訟':(typeFilter==='counsel'?'法律顧問':'全部類型'));
  var statusLabel = statusFilter==='urgent'?'優先處理':(statusFilter==='progress'?'處理中':(statusFilter==='done'?'已完成':'全部狀態'));
  var viewTitleEl = document.getElementById('viewTitle');
  if(viewTitleEl){
    if(currentMember){
      viewTitleEl.textContent = currentMember.name;
    } else {
      viewTitleEl.textContent = typeLabel + ' · ' + statusLabel;
    }
  }

  // ── 類型統計列 ──
  document.getElementById('typeStatsRow').innerHTML=`
    <div class="stat-box stat-clickable${typeFilter===null?' stat-active':''}" onclick="setTypeFilter(null)"><div class="stat-num">${typeAll}</div><div class="stat-lbl">全部類型</div></div>
    <div class="stat-box stat-clickable${typeFilter==='litigation'?' stat-active':''}" onclick="setTypeFilter('litigation')"><div class="stat-num" style="color:#E8E2D0">${typeLit}</div><div class="stat-lbl">訴訟</div></div>
    <div class="stat-box stat-clickable${typeFilter==='nonlitigation'?' stat-active':''}" onclick="setTypeFilter('nonlitigation')"><div class="stat-num" style="color:#6BB6E8">${typeNon}</div><div class="stat-lbl">非訟</div></div>
    <div class="stat-box stat-clickable${typeFilter==='counsel'?' stat-active':''}" onclick="setTypeFilter('counsel')"><div class="stat-num" style="color:#5FC98E">${typeCounsel}</div><div class="stat-lbl">法律顧問</div></div>
  `;

  document.getElementById('statsRow').innerHTML=`
    <div class="stat-box stat-clickable${statusFilter===null?' stat-active':''}" onclick="setStatusFilter(null)"><div class="stat-num">${totalCount}</div><div class="stat-lbl">全部狀態</div></div>
    <div class="stat-box stat-clickable${statusFilter==='urgent'?' stat-active':''}" onclick="setStatusFilter('urgent')"><div class="stat-num" style="color:#FF7B7A">${urgent}</div><div class="stat-lbl">優先處理</div></div>
    <div class="stat-box stat-clickable${statusFilter==='progress'?' stat-active':''}" onclick="setStatusFilter('progress')"><div class="stat-num" style="color:#F5B84A">${prog}</div><div class="stat-lbl">處理中</div></div>
    <div class="stat-box stat-clickable${statusFilter==='done'?' stat-active':''}" onclick="setStatusFilter('done')"><div class="stat-num" style="color:#2ECFA0">${done}</div><div class="stat-lbl">已完成</div></div>

  const body=document.getElementById('caseBody');

    body.innerHTML=`<tr><td colspan="13" style="text-align:center;padding:44px;color:var(--tm);color:var(--tm)" colspan="12">${q?'沒有符合的案件':'點擊「新增案件」開始'}</td></tr>`;
    return;
  }
  const mname=getMemberName.bind(null);
  // Sort: status priority, then deadline, then court
  if(!isSecretary){
    const statusOrder={urgent:0,progress:1,done:2};
    data.sort((a,b)=>{
      const sd=(statusOrder[a.status]??1)-(statusOrder[b.status]??1);
      if(sd!==0) return sd;
      const ad=a.deadline||'9999', bd=b.deadline||'9999';
      if(ad!==bd) return ad<bd?-1:1;
      const ac=a.court||'9999', bc=b.court||'9999';
      return ac<bc?-1:ac>bc?1:0;
    });
  }
  body.innerHTML=data.map(c=>{
    var trClass = (selectMode?'select-row':'') + (selectedCaseIds.includes(c.id)?' row-selected':'');
    return '<tr class="'+trClass+'" data-case-id="'+c.id+'">'+
    '<td class="checkbox-col tr1-cell" style="'+(selectMode?'':'display:none')+'">'+
      '<div class="cw" style="justify-content:center"><input type="checkbox" class="case-checkbox" data-id="'+c.id+'" '+(selectedCaseIds.includes(c.id)?'checked':'')+' style="width:18px;height:18px;accent-color:var(--gold);cursor:pointer;pointer-events:none"></div></td>'+`
    <td class="ed" data-id="${c.id}" data-field="name" onclick="activateTextCell(this,'${c.id}','name')" style="width:180px">
      <div class="cw"><span class="ct${!c.name?' cm':''}" style="white-space:pre-wrap;word-break:break-word;line-height:1.4">${c.name?(window.innerWidth<=1024?c.name.replace(/[\n\r]+/g,' ').trim():c.name).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'—'}</span></div></td>
    <td class="ed" data-id="${c.id}" data-field="courthouse" onclick="handleCourthouseCellClick(event,this,'${c.id}')" style="width:90px;max-width:90px">

function renderMemoView(q, currentMember){
  document.body.classList.remove('petty-mode');
  document.body.classList.add('memo-mode');
  setMemoHead();
  // 只取備忘錄
  var data = cases.filter(c=>c.isMemo);
  // 搜尋：待辦事項 + 詳細說明（疊加）
  if(q) data = data.filter(function(c){
    return (c.name||'').toLowerCase().includes(q) || (c.desc||'').toLowerCase().includes(q);
  });
  // 標籤篩選（一次一個，有貼該標籤就顯示）
  if(memoTagFilter) data = data.filter(function(c){
    return (c.memoTags||[]).includes(memoTagFilter);
  });
  // 排序：照截止日（早的在上，沒填的排最後）
  data.sort(function(a,b){
    var da=a.deadline||'', db=b.deadline||'';
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da < db ? -1 : (da > db ? 1 : 0);
  });

  // ── 動態標題：營運經理 · 待辦事項（有篩標籤時標出來）──
  var viewTitleEl = document.getElementById('viewTitle');
  if(viewTitleEl){
    var t = memoTagFilter ? memoTagByKey(memoTagFilter) : null;

  }

  var tagCell = function(t){
    var active = (memoTagFilter===t.key);
    return '<div class="memo-stat-box stat-clickable'+(active?' stat-active':'')+'" onclick="setMemoTagFilter(\''+t.key+'\')">' +
      '<span class="memo-tag-lbl" style="color:'+t.color+'">'+t.label+'</span></div>';
  };

  document.getElementById('typeStatsRow').innerHTML =
    '<div class="memo-stat-box">' +
      '<button class="tn-btn tn-add" onclick="addNewMemo()"><i class="ti ti-plus"></i> <span class="lbl-full">新增待辦事項</span><span class="lbl-short">新增</span></button></div>' +
    tagCell(MEMO_TAGS[0]) + tagCell(MEMO_TAGS[1]) + tagCell(MEMO_TAGS[2]);
  // 下排
  var allActive = (memoTagFilter===null);
  document.getElementById('statsRow').innerHTML =
    '<div class="memo-stat-box stat-clickable'+(allActive?' stat-active':'')+'" onclick="setMemoTagFilter(null)">' +
      '<span class="memo-tag-lbl" style="color:var(--t1)"><span class="lbl-full">全部待辦事項</span><span class="lbl-short">全部</span></span></div>' +
    tagCell(MEMO_TAGS[3]) + tagCell(MEMO_TAGS[4]) + tagCell(MEMO_TAGS[5]);

  // ── 列表：待辦事項 → 標籤 → 截止日 → 詳細說明 → 刪除 ──
  var body = document.getElementById('caseBody');
  if(!data.length){
    var emptyMsg = q ? '沒有符合的待辦事項' : (memoTagFilter ? '這個標籤底下沒有待辦事項' : '點擊「＋新增」開始');
    body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:44px;color:var(--tm)">'+emptyMsg+'</td></tr>';
    return;
  }
  body.innerHTML = data.map(function(c){
    var trClass = (selectMode?'select-row':'') + (selectedCaseIds.includes(c.id)?' row-selected':'');
    return '<tr class="'+trClass+'" data-case-id="'+c.id+'">' +
      '<td class="checkbox-col tr1-cell" style="'+(selectMode?'':'display:none')+'">' +
        '<div class="cw" style="justify-content:center"><input type="checkbox" class="case-checkbox" data-id="'+c.id+'" '+(selectedCaseIds.includes(c.id)?'checked':'')+' style="width:18px;height:18px;accent-color:var(--gold);cursor:pointer;pointer-events:none"></div></td>' +
      '<td class="ed" data-id="'+c.id+'" data-field="name" onclick="activateTextCell(this,\''+c.id+'\',\'name\')" style="width:280px">' +
        '<div class="cw"><span class="ct'+(!c.name?' cm':'')+'" style="white-space:pre-wrap;word-break:break-word;line-height:1.4">'+(c.name?(window.innerWidth<=1024?c.name.replace(/[\n\r]+/g,' ').trim():c.name).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'—')+'</span></div></td>' +
      '<td class="tag-cell" onclick="openMemoTagPopup(event,\''+c.id+'\')" style="cursor:pointer">' +
        '<div class="cw">'+renderMemoTagChips(c)+'</div></td>' +
      '<td class="date-cell ed" onclick="openCalendar(event,\''+c.id+'\',\'deadline\')">' +
        '<div class="cw" style="justify-content:center"><span class="'+dlClsSmart(c.deadline)+'" style="'+dateStyle(c.deadline)+'">'+(fmtDateSmart(c.deadline)||'<span class="cm">—</span>')+'</span></div></td>' +
      '<td class="ed desc-cell" data-id="'+c.id+'" data-field="desc" onclick="handleDescCellClick(event,this,\''+c.id+'\')">' +
        '<div class="cw"><span class="ct'+(!c.desc?' cm':'')+'" style="white-space:pre-wrap;line-height:1.5;word-break:break-word">'+(c.desc?c.desc.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'—')+'</span></div></td>' +
      '<td style="text-align:center">' +
        '<button class="del-btn" onclick="deleteRow(\''+c.id+'\')" title="刪除"><i class="ti ti-trash"></i></button></td>' +
    '</tr>';
  }).join('');
  attachRowSelectListeners();
  updateSelectedCountLabel();
}

let memoTagPopupCaseId = null;
function closeMemoTagPopup(){
  document.getElementById('memoTagPopup').style.display='none';
  var bd=document.getElementById('memoTagPopupBackdrop');
  if(bd) bd.style.display='none';
  memoTagPopupCaseId=null;
}
function openMemoTagPopup(e, caseId){
  e.stopPropagation();
  commitActiveCell();
  memoTagPopupCaseId=caseId;
  if(isTabletOrMobileMode()){ document.getElementById('memoTagPopupBackdrop').style.display='block'; }
  var c=cases.find(x=>x.id===caseId);
  var selected=c.memoTags||[];
  var list=document.getElementById('memoTagPopupList');
  list.innerHTML=MEMO_TAGS.map(function(t){
    var on=selected.includes(t.key);
    return '<div class="sp-item" onclick="toggleMemoTag(\''+t.key+'\')" id="mtp_'+t.key+'">' +
      '<div class="pp-box" style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bd-b);display:flex;align-items:center;justify-content:center;flex-shrink:0;'+(on?'background:'+t.color+';border-color:'+t.color:'')+'">' +
        '<i class="ti ti-check mtp-check" style="font-size:11px;color:var(--navy);'+(on?'':'display:none;')+'"></i>' +
      '</div>' +
      '<span style="color:'+t.color+';font-weight:600">'+t.label+'</span>' +
    '</div>';
  }).join('');
  var pop=document.getElementById('memoTagPopup');
  pop.style.display='block';
  var rect=e.currentTarget.getBoundingClientRect();
  var left=rect.left, top=rect.bottom+4;
  if(left+200>window.innerWidth) left=window.innerWidth-204;
  if(top+260>window.innerHeight) top=rect.top-260;
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function toggleMemoTag(key){
  if(!memoTagPopupCaseId) return;
  var c=cases.find(x=>x.id===memoTagPopupCaseId);
  if(!c) return;
  if(!c.memoTags) c.memoTags=[];
  var idx=c.memoTags.indexOf(key);
  if(idx>=0) c.memoTags.splice(idx,1);
  else c.memoTags.push(key);
  dbSaveCase(c);
  // 只更新這一列的勾勾與方框，不重開選單
  var t=memoTagByKey(key);
  var row=document.getElementById('mtp_'+key);
  if(row && t){
    var on=c.memoTags.includes(key);
    var box=row.querySelector('.pp-box');
    var check=row.querySelector('.mtp-check');
    if(box){
      box.style.background = on ? t.color : '';
      box.style.borderColor = on ? t.color : 'var(--bd-b)';
    }
    if(check){ check.style.display = on ? '' : 'none'; }
  }
  // 背景列表也更新，但不動選單
  renderCases();
}

      '</div>' +

  document.getElementById('statsRow').innerHTML = '';

  var data = pettyCash.slice();

    return;

  body.innerHTML = data.map(function(e){
    var isInc = e.entryType==='income';
    var amtColor = isInc ? '#5FC98E' : '#E67C73';
    var amtText = (isInc?'+':'-') + fmtMoney(e.amount).replace('$','$');
    var dd = (e.entryDate||'').slice(5).replace('-','/'); // mm/dd
    var sel = selectMode;
    var checked = selectedCaseIds.includes(e.id);
    var trClass = (sel?'select-row':'') + (checked?' row-selected':'');

    var dateStyle = 'width:130px;text-align:center;color:var(--t2)';

      ? '<td class="date-cell" style="'+dateStyle+'">'+(dd||'—')+'</td>'
      : '<td class="ed date-cell" onclick="openPettyRowCalendar(event,\''+e.id+'\')" style="cursor:pointer;'+dateStyle+'">'+(dd||'—')+'</td>';
    var catInner = '<div class="cw" style="justify-content:center">'+renderPettyCatChips(e)+'</div>';
    var catCell = (isInc || sel)
      ? '<td style="width:190px;text-align:center">'+catInner+'</td>'
      : '<td class="ed" data-petty-cat-cell onclick="openPettyCatPopup(event,\''+e.id+'\')" style="cursor:pointer;width:190px;text-align:center">'+catInner+'</td>';
    var amtStyle = 'width:150px;text-align:center;color:'+amtColor+';font-weight:700';

      ? '<td style="'+amtStyle+'">'+amtText+'</td>'

      : '<td class="ed" onclick="activatePettyTextCell(this,\''+e.id+'\',\'note\')" style="cursor:pointer;'+noteStyle+'">'+(e.note?e.note.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'<span class="cm">—</span>')+'</td>';

  }).join('');

// 多選模式：整列點擊＝勾選
function attachPettyRowSelectListeners(){
  if(!selectMode) return;
  var rows = document.querySelectorAll('#caseBody tr[data-petty-id]');
  rows.forEach(function(row){
    row.addEventListener('click', function(ev){
      ev.stopPropagation(); ev.preventDefault();
      var id = row.getAttribute('data-petty-id');
      if(id) togglePettySelection(id);
    }, true);
  });
}
function togglePettySelection(id){
  var idx = selectedCaseIds.indexOf(id);
  if(idx>=0){ selectedCaseIds.splice(idx,1); } else { selectedCaseIds.push(id); }
  updateSelectedCountLabel();
  var cb = document.querySelector('.petty-checkbox[data-id="'+id+'"]');
  if(cb){
    cb.checked = selectedCaseIds.includes(id);
    var row = cb.closest('tr');
    if(row) row.classList.toggle('row-selected', selectedCaseIds.includes(id));
  }
}

  var digits = (el.value||'').replace(/[^\d]/g, ''); // 只留數字

  el.value = Number(digits).toLocaleString('en-US');

  var type=document.getElementById('pettyEntryType').value;
  var obj={
    entryType:type,
    amount:amt,
    categories: type==='expense' ? pettyModalCats.slice() : [],
    note:document.getElementById('pcNote').value||'',
    entryDate:document.getElementById('pcDate').value||todayStr()

// ── 零用金 DB 操作 ──
function dbSavePetty(obj){
  var row={
    entry_type: obj.entryType,
    amount: obj.amount,
    categories: obj.categories || [],
    note: obj.note || '',
    entry_date: obj.entryDate
  };
  _SB.from('petty_cash').insert(row).then(function(r){
    if(r.error){ console.error('Insert petty error:', r.error); alert('儲存失敗：'+r.error.message); return; }
    loadData();
  });
}
// 更新單一欄位（就地編輯用）
function dbUpdatePettyField(id, patch){
  _SB.from('petty_cash').update(patch).eq('id', id).then(function(r){
    if(r.error){ console.error('Update petty error:', r.error); alert('更新失敗：'+r.error.message); return; }
    loadData();
  });
}

function commitPettyCell(){
  if(!pettyActiveCell) return;
  var pc=pettyActiveCell; pettyActiveCell=null;
  var e=pettyCash.find(function(x){return x.id===pc.id;});
  if(!e){ return; }
  if(pc.field==='amount'){
    var digits=(pc.input.value||'').replace(/[^\d]/g,'');
    var val=digits?Number(digits):0;
    if(val>0 && val!==e.amount){ dbUpdatePettyField(pc.id, {amount: val}); return; }
  } else if(pc.field==='note'){
    var v=pc.input.value;
    if(v!==e.note){ dbUpdatePettyField(pc.id, {note: v}); return; }
  }
  renderCases(); // 沒變也重繪回原樣
}
function activatePettyTextCell(td, id, field){
  if(pettyActiveCell && pettyActiveCell.td===td) return;
  commitPettyCell();
  var e=pettyCash.find(function(x){return x.id===id;});
  if(!e) return;
  td.innerHTML='';
  var input=document.createElement('input');
  input.type='text';
  input.className='ii';
  input.setAttribute('autocomplete','off');
  input.setAttribute('autocorrect','off');
  input.setAttribute('spellcheck','false');
  if(field==='amount'){
    input.setAttribute('inputmode','numeric');
    input.value = e.amount ? Number(e.amount).toLocaleString('en-US') : '';
    input.style.textAlign='right';
    input.addEventListener('input',function(){ formatPettyAmount(input); });
  } else {
    input.value = e.note || '';
  }
  input.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){ pettyActiveCell=null; renderCases(); }
    else if(ev.key==='Enter'){ ev.preventDefault(); commitPettyCell(); }
  });
  input.addEventListener('blur',function(){
    setTimeout(function(){ if(pettyActiveCell&&pettyActiveCell.input===input){ commitPettyCell(); } },200);
  });
  pettyActiveCell={td,id,field,input};
  td.appendChild(input);
  input.focus();
  if(field==='amount'){ input.select(); }
}

// ── Directly attach click listeners to each row using CAPTURE phase ──
// Capture phase fires BEFORE any child's own onclick (status popup, calendar, edit cell, etc.)
// so we can intercept the click before it reaches those handlers, regardless of pointer-events CSS support.
function attachRowSelectListeners(){
  if(!selectMode) return;
  var rows = document.querySelectorAll('#caseBody tr[data-case-id]');
  rows.forEach(function(row){
    row.addEventListener('click', function(e){
      e.stopPropagation();
      e.preventDefault();
      var caseId = row.getAttribute('data-case-id');
      if(caseId) toggleCaseSelection(caseId);
    }, true); // true = capture phase
  });
}

function setStatusFilter(status){
  statusFilter = status;
  renderCases();
}
function setTypeFilter(type){
  typeFilter = type;

function toggleSelectMode(){
  selectMode = !selectMode;
  selectedCaseIds = [];
  document.getElementById('selectModeBtn').classList.toggle('active', selectMode);
  document.getElementById('multiSelectBar').style.display = selectMode ? 'flex' : 'none';
  var cbHead = document.getElementById('checkboxHeaderCell');
  if(cbHead) cbHead.style.display = selectMode ? '' : 'none'; // 備忘錄表頭時此元素不存在，renderCases 會重建
  document.body.classList.toggle('select-mode-on', selectMode);
  renderCases();
}

function toggleCaseSelection(caseId){
  var idx = selectedCaseIds.indexOf(caseId);
  if(idx >= 0){ selectedCaseIds.splice(idx, 1); }
  else { selectedCaseIds.push(caseId); }
  updateSelectedCountLabel();
  // update checkbox + row highlight without full re-render
  var checkbox = document.querySelector('.case-checkbox[data-id="'+caseId+'"]');
  if(checkbox){
    checkbox.checked = selectedCaseIds.includes(caseId);
    var row = checkbox.closest('tr');
    if(row) row.classList.toggle('row-selected', selectedCaseIds.includes(caseId));
  }
}

function updateSelectedCountLabel(){
  var lbl = document.getElementById('selectedCountLabel');
  if(lbl) lbl.textContent = '已選擇 ' + selectedCaseIds.length + ' 筆';
}

function deleteSelectedCases(){
  if(pettyView){
    if(!selectedCaseIds.length){ alert('請先選擇要刪除的帳目'); return; }
    if(!confirm('確定要刪除這 '+selectedCaseIds.length+' 筆帳目嗎？（可在垃圾桶復原）')) return;
    var ids = selectedCaseIds.slice();
    _SB.from('petty_cash').update({deleted_at: new Date().toISOString()}).in('id', ids).then(function(r){
      if(r.error){ console.error('Delete petty multi error:', r.error); alert('刪除失敗：'+r.error.message); return; }
      loadData();
    });
    selectedCaseIds = [];
    toggleSelectMode();
    return;
  }
  var noun = isOpsManagerView() ? '待辦事項' : '案件';
  if(!selectedCaseIds.length){ alert('請先選擇要刪除的'+noun); return; }
  if(!confirm('確定要刪除這 '+selectedCaseIds.length+' 筆'+noun+'嗎？（可在垃圾桶復原）')) return;
  dbDeleteCasesMulti(selectedCaseIds.slice());
  selectedCaseIds = [];
  toggleSelectMode();
}

// ── Trash bin ──
function openTrash(){
  document.getElementById('trashModal').classList.add('show');
  if(pettyView){ loadPettyTrash(); } else { loadTrash(); }
}
function closeTrash(){
  document.getElementById('trashModal').classList.remove('show');
}
function renderTrash(){
  var body = document.getElementById('trashBody');
  var titleEl = document.getElementById('trashModalTitle');
  var noteEl = document.getElementById('trashNote');

  // ── 零用金垃圾桶 ──
  if(pettyView){
    if(titleEl) titleEl.innerHTML = '<i class="ti ti-trash" style="margin-right:6px"></i>垃圾桶（零用金）';
    if(noteEl) noteEl.textContent = '已刪除的帳目會保留 30 天，期滿後自動永久刪除';
    var plist = trashedPetty || [];
    if(!plist.length){
      body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--tm);font-size:13px">垃圾桶是空的</div>';
      return;
    }
    body.innerHTML = plist.map(function(e){
      var deletedDate = e.deleted_at ? new Date(e.deleted_at) : null;
      var daysLeft = deletedDate ? Math.max(0, 30 - Math.floor((Date.now()-deletedDate.getTime())/86400000)) : 30;
      var isInc = e.entryType==='income';
      var title = (isInc?'撥款 ':'支出 ') + (isInc?'+':'-') + fmtMoney(e.amount);
      var meta = (e.entryDate||'') + (e.note?('　'+e.note.slice(0,30)):'');
      return '<div class="trash-item">' +
        '<div class="trash-item-info">' +
          '<div class="trash-item-name" style="color:'+(isInc?'#5FC98E':'#E67C73')+'">' + title + '</div>' +
          '<div class="trash-item-meta">' + meta.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
          '<div class="trash-item-days">' + daysLeft + ' 天後永久刪除</div>' +
        '</div>' +
        '<div class="trash-item-actions">' +
          '<button class="btn bg" style="font-size:12px;padding:5px 12px" onclick="dbRestorePetty(\''+e.id+'\')"><i class="ti ti-rotate"></i> 還原</button>' +
          '<button class="btn bda" style="font-size:12px;padding:5px 12px" onclick="confirmPermanentDeletePetty(\''+e.id+'\')"><i class="ti ti-trash-x"></i> 永久刪除</button>' +
        '</div>' +
      '</div>';
    }).join('');
    return;
  }

  var inMemo = isOpsManagerView();
  // 垃圾桶內容依當前頁面切換：營運經理→只看備忘錄垃圾桶；其他→只看案件垃圾桶
  var list = trashedCases.filter(function(c){ return inMemo ? c.isMemo : !c.isMemo; });
  // 更新標題與說明文字
  if(titleEl) titleEl.innerHTML = '<i class="ti ti-trash" style="margin-right:6px"></i>' + (inMemo?'垃圾桶（待辦事項）':'垃圾桶');
  if(noteEl) noteEl.textContent = (inMemo?'已刪除的待辦事項':'已刪除的案件') + '會保留 30 天，期滿後自動永久刪除';
  if(!list.length){
    body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--tm);font-size:13px">垃圾桶是空的</div>';
    return;
  }
  body.innerHTML = list.map(function(c){
    var deletedDate = c.deleted_at ? new Date(c.deleted_at) : null;
    var daysLeft = deletedDate ? Math.max(0, 30 - Math.floor((Date.now()-deletedDate.getTime())/86400000)) : 30;
    return '<div class="trash-item">' +
      '<div class="trash-item-info">' +
        '<div class="trash-item-name">' + (c.name||'未命名案件') + '</div>' +
        '<div class="trash-item-meta">' + (c.desc ? c.desc.slice(0,40).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '') + '</div>' +
        '<div class="trash-item-days">' + daysLeft + ' 天後永久刪除</div>' +
      '</div>' +
      '<div class="trash-item-actions">' +
        '<button class="btn bg" style="font-size:12px;padding:5px 12px" onclick="dbRestoreCase(\''+c.id+'\')"><i class="ti ti-rotate"></i> 還原</button>' +
        '<button class="btn bda" style="font-size:12px;padding:5px 12px" onclick="confirmPermanentDelete(\''+c.id+'\')"><i class="ti ti-trash-x"></i> 永久刪除</button>' +
      '</div>' +
    '</div>';
  }).join('');
}
function confirmPermanentDelete(id){
  if(!confirm('永久刪除後將無法復原，確定要繼續嗎？')) return;
  dbPermanentDeleteCase(id);
}


// ── Fullscreen Desc Editor (mobile) ──
var descEditorField = "desc", descEditorCaseId = null;
function openDescEditor(caseId, field){
  var c = cases.find(function(x){ return x.id === caseId; });
  if(!c) return;
  descEditorCaseId = caseId;
  descEditorField = field || 'desc';
  document.getElementById('descEditorCaseName').textContent = c.name || '未命名案件';
  document.querySelector('.desc-editor-title').textContent = (descEditorField==='adminNote') ? '行政事項' : (c.isMemo ? '詳細說明' : '進行概述');
  var ta = document.getElementById('descEditorTextarea');
  ta.value = c[descEditorField] || '';
  var overlay = document.getElementById('descEditorOverlay');
  overlay.classList.add('show');
  var closeBtn = document.getElementById('descEditorCloseBtn');
  closeBtn.style.display = 'inline-block';

  // Remove old keydown listener if any, then add new one
  if(ta._descKeyHandler) ta.removeEventListener('keydown', ta._descKeyHandler);
  if(ta._descCompStart) ta.removeEventListener('compositionstart', ta._descCompStart);
  if(ta._descCompEnd) ta.removeEventListener('compositionend', ta._descCompEnd);

  var descIsComposing = false;
  ta._descCompStart = function(){ descIsComposing = true; };
  ta._descCompEnd = function(){ setTimeout(function(){ descIsComposing = false; }, 0); };
  ta._descKeyHandler = function(e){
    if(e.key === 'Escape'){
      // 桌機方便：Esc 關閉（等同完成）
      closeDescEditor();
    }
    // Enter＝純換行：全螢幕大文字框本來就要能自由換行，
    // 不攔截 Enter、不送出。要儲存請按「完成」或鍵盤的「打勾」收起。
  };
  ta.addEventListener('compositionstart', ta._descCompStart);
  ta.addEventListener('compositionend', ta._descCompEnd);
  ta.addEventListener('keydown', ta._descKeyHandler);
  ta.focus();
}
function closeDescEditor(){
  if(descEditorCaseId){
    var c = cases.find(function(x){ return x.id === descEditorCaseId; });
    if(c){
      c[descEditorField||'desc'] = document.getElementById('descEditorTextarea').value;
      dbSaveCase(c);
    }
  }
  document.getElementById('descEditorOverlay').classList.remove('show');
  descEditorCaseId = null;
  descEditorField = 'desc';
}
function descEditorOverlayClick(e){
  // Only close if clicking the overlay itself (not the modal content) AND on desktop
  if(e.target.id === 'descEditorOverlay' && isDesktopMode()){
    closeDescEditor();
  }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && document.getElementById('descEditorOverlay').classList.contains('show') && isDesktopMode()){
    closeDescEditor();
  }
});

function renderPersonChips(c){
  const ids=c.personIds||(c.personId?[c.personId]:[]);
  if(!ids.length) return '<span class="cm">—</span>';
  var chipMembers = ids.map(id=>members.find(x=>x.id===id)).filter(Boolean);
  chipMembers.sort(function(a,b){
    if(a.name==='所長督辦') return -1;
    if(b.name==='所長督辦') return 1;
    return 0;
  });
  return '<div style="display:flex;flex-direction:column;gap:3px;">'+chipMembers.map(m=>{
    var goldStyle = (m.name==='所長督辦') ? ' style="color:var(--gold);border-color:var(--gold)"' : '';
    return `<span class="pchip"${goldStyle}>${m.name}</span>`;
  }).join('')+'</div>';
}

function togglePersonAssign(memberId){
  if(!personPopupCaseId) return;
  const c=cases.find(x=>x.id===personPopupCaseId);
  if(!c) return;
  if(!c.personIds) c.personIds=c.personId?[c.personId]:[];
  const idx=c.personIds.indexOf(memberId);
  if(idx>=0) c.personIds.splice(idx,1);
  else c.personIds.push(memberId);
  var pCase=cases.find(function(x){return x.id===personPopupCaseId;});
  if(pCase) dbSaveCase(pCase);
  // 只更新這一列的勾勾與方框，不重開選單（避免跳動）
  var row=document.getElementById('pp_'+memberId);
  if(row){
    var on=c.personIds.includes(memberId);
    var box=row.querySelector('.pp-box');
    var check=row.querySelector('.pp-check');
    if(box){
      box.style.background = on ? 'var(--gold)' : '';
      box.style.borderColor = on ? 'var(--gold)' : 'var(--bd-b)';
    }
    if(check){
      check.style.display = on ? '' : 'none';
    }
  }
  // 背景的案件列表也更新，但不動選單
  renderSidebar(); renderCases();
}

// ── Case Modal ──
function closeCaseModal(){ document.getElementById('caseModal').classList.remove('show'); }
function saveCaseModal(){
  var name=document.getElementById('cName').value.trim();
  if(!name){alert('請填寫案件名稱');return;}
  var selectedIds=Array.from(document.querySelectorAll('.person-cb:checked')).map(function(el){return el.dataset.id;});
  var obj={
    name:name,
    caseType:document.getElementById('cCaseType').value||'litigation',
    status:document.getElementById('cStatus').value,
    court:document.getElementById('cCourt').value||null,
    deadline:document.getElementById('cDeadline').value||null,
    courthouse:document.getElementById('cCourthouse').value||'',
    caseNum:document.getElementById('cCaseNum').value||'',
    courtStock:document.getElementById('cCourtStock').value||'',
    phone:document.getElementById('cPhone').value||'',
    ext:document.getElementById('cExt').value||'',
    desc:document.getElementById('cDesc').value||'',
    personIds:selectedIds
  };
  closeCaseModal();
  if(editingCaseId){
    var idx=cases.findIndex(function(x){return x.id===editingCaseId;});
    if(idx>=0){
      var updated=Object.assign({}, cases[idx], obj);
      dbSaveCase(updated);
    }
  } else {
    var newCase=Object.assign({id:'tmp_'+uid()}, obj);
    dbSaveCase(newCase);
  }
}
function deleteCaseFromModal(){
  if(!editingCaseId||!confirm('確定刪除此案件？')) return;
  var delId=editingCaseId;
  closeCaseModal();
  dbDeleteCase(delId);
}


// ── Drag to reorder members ──
let dragSrcId=null;
function dragStart(e, id){
  dragSrcId=id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drag-over');
}
function dragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function dragDrop(e, targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(dragSrcId===targetId) return;
  const srcIdx=members.findIndex(m=>m.id===dragSrcId);
  const tgtIdx=members.findIndex(m=>m.id===targetId);
  if(srcIdx<0||tgtIdx<0) return;
  const [moved]=members.splice(srcIdx,1);
  members.splice(tgtIdx,0,moved);
  members.forEach(function(m,i){ m.sort_order=i; dbSaveMember(m); });
  renderSidebar();
}
function dragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.tn-member').forEach(el=>el.classList.remove('drag-over','dragging'));
  dragSrcId=null;
}
</script>
